<form
  (ngSubmit)="onSubmit()"
  class="w-full max-w-sm mx-auto bg-white border border-slate-200 rounded-lg shadow-md p-6 space-y-4"
>
  <h2 class="text-2xl font-bold text-main text-center">Iniciar sesión</h2>

  <div>
    <label for="email" class="block text-sm font-medium mb-1">Correo</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-main"
    />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium mb-1">Contraseña</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-main"
    />
  </div>

  <button
    type="submit"
    [disabled]="!email || !password"
    class="w-full bg-main text-white py-2 rounded font-semibold shadow-md hover:bg-main-dark hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
  >
    Entrar
  </button>
</form>
